MODEL:
  architecture: "TSViT-DINOv3"
  img_res: 24
  patch_size: 2
  in_channels: 10
  num_classes: 19
  dim: 192
  temporal_depth: 4
  spatial_depth: 4
  heads: 4
  dim_head: 48
  mlp_ratio: 4
  dropout: 0.1
  dinov3_model_name: "facebook/dinov3-vits16-pretrain-lvd1689m"

DATA:
  max_seq_len: 45
  img_res: 24
  num_channels: 10
  num_classes: 19
  batch_size: 16
  val_split: 0.2
  num_workers: 2

SOLVER:
  epochs: 50
  lr_base: 0.001
  lr_min: 0.00001
  weight_decay: 0.0001
  warmup_epochs: 5
  loss_function: "cross_entropy"
  ignore_index: 0
